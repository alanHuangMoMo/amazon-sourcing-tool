{% extends "base.html" %}
{% block content %}
<div x-data="nicheDetail()" class="max-w-full mx-auto px-4">

    <!-- 顶部：返回 + 摘要 -->
    <div class="flex items-center gap-3 mb-4">
        <a :href="'/niche/{{ batch_id }}'" class="text-gray-500 hover:text-gray-300 text-sm">← Niche 列表</a>
        <span class="text-gray-600">|</span>
        <span class="text-sm text-gray-400" x-text="'批次: {{ batch_id }}'"></span>
    </div>

    <template x-if="loading">
        <div class="text-center py-20 text-gray-500">
            <svg class="animate-spin h-8 w-8 mx-auto mb-3" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            加载 niche 数据中（含 API 查询，约需 1-2 分钟）...
        </div>
    </template>

    <template x-if="!loading && !error">
        <div>
            <!-- ① 摘要条 -->
            <div class="bg-gray-800 rounded-xl p-5 border border-gray-700 mb-4">
                <h1 class="text-2xl font-bold mb-3" x-text="niche.name"></h1>
                <div class="grid grid-cols-4 md:grid-cols-8 gap-3 text-center">
                    <div class="bg-gray-700/50 rounded-lg p-2">
                        <div class="text-lg font-bold text-blue-400" x-text="summary.core_count"></div>
                        <div class="text-xs text-gray-500">核心 ASIN</div>
                    </div>
                    <div class="bg-gray-700/50 rounded-lg p-2">
                        <div class="text-lg font-bold text-yellow-400" x-text="summary.keyword_count"></div>
                        <div class="text-xs text-gray-500">关键词</div>
                    </div>
                    <div class="bg-gray-700/50 rounded-lg p-2">
                        <div class="text-lg font-bold text-purple-400" x-text="summary.expanded_count"></div>
                        <div class="text-xs text-gray-500">扩展 ASIN</div>
                    </div>
                    <div class="bg-gray-700/50 rounded-lg p-2">
                        <div class="text-lg font-bold" :class="summary.density > 30 ? 'text-red-400' : summary.density > 15 ? 'text-yellow-400' : 'text-green-400'" x-text="summary.density + '%'"></div>
                        <div class="text-xs text-gray-500">竞争密度</div>
                    </div>
                    <div class="bg-gray-700/50 rounded-lg p-2">
                        <div class="text-lg font-bold text-white" x-text="'\$' + summary.price_min.toFixed(0)"></div>
                        <div class="text-xs text-gray-500">最低价</div>
                    </div>
                    <div class="bg-gray-700/50 rounded-lg p-2">
                        <div class="text-lg font-bold text-white" x-text="'\$' + summary.price_max.toFixed(0)"></div>
                        <div class="text-xs text-gray-500">最高价</div>
                    </div>
                    <div class="bg-gray-700/50 rounded-lg p-2">
                        <div class="text-lg font-bold text-white" x-text="summary.avg_rating"></div>
                        <div class="text-xs text-gray-500">平均评分</div>
                    </div>
                    <div class="bg-gray-700/50 rounded-lg p-2">
                        <div class="text-lg font-bold text-white" x-text="filteredProducts.length"></div>
                        <div class="text-xs text-gray-500">产品</div>
                    </div>
                </div>
            </div>

            <div class="flex gap-4" style="min-height: calc(100vh - 250px)">
                <!-- ② 左侧：关键词竞争矩阵 -->
                <div class="w-72 flex-shrink-0">
                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 sticky top-4">
                        <h3 class="text-sm font-medium text-gray-400 mb-3">关键词竞争矩阵</h3>
                        <div class="text-xs text-gray-600 mb-2">■ = niche ASIN 上首页 / □ = 不在</div>

                        <!-- 筛选按钮 -->
                        <div class="flex gap-1 mb-3">
                            <button @click="activeKeyword = ''"
                                    class="flex-1 text-xs py-1 rounded"
                                    :class="activeKeyword === '' ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-400'">全部</button>
                        </div>

                        <div class="space-y-2 max-h-[calc(100vh-350px)] overflow-y-auto">
                            <template x-for="kw in niche.keywords" :key="kw.keyword">
                                <div @click="activeKeyword = kw.keyword"
                                     class="rounded p-2 cursor-pointer transition-colors text-xs"
                                     :class="activeKeyword === kw.keyword ? 'bg-blue-900/30 border border-blue-700' : 'bg-gray-700/30 hover:bg-gray-700/50'">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="font-medium text-gray-300 truncate max-w-32" x-text="kw.keyword"></span>
                                        <span class="text-gray-500" x-text="kw.density + '%'"></span>
                                    </div>
                                    <div class="flex items-center gap-1 text-gray-500">
                                        <span x-text="kw.niche_hits + '/' + kw.page1_count"></span>
                                        <div class="flex-1 bg-gray-600 rounded-full h-1">
                                            <div class="bg-blue-500 h-1 rounded-full" :style="'width:' + (kw.niche_hits / kw.page1_count * 100) + '%'"></div>
                                        </div>
                                    </div>
                                    <!-- 命中 ASIN 缩略列表 -->
                                    <div class="mt-1 flex flex-wrap gap-1">
                                        <template x-for="m in matrix.filter(x => x.keyword === kw.keyword).slice(0,5)" :key="m.asin">
                                            <span class="text-gray-600"
                                                  :class="m.is_core ? 'text-blue-400' : ''"
                                                  x-text="m.asin.slice(-4)"></span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- ③ 右侧：产品卡片网格 -->
                <div class="flex-1 min-w-0">
                    <!-- 工具栏 -->
                    <div class="flex gap-3 mb-3 flex-wrap items-center">
                        <select x-model="filterSource" class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm">
                            <option value="all">全部产品</option>
                            <option value="core">核心 ASIN</option>
                            <option value="similar">相似 ASIN</option>
                        </select>
                        <select x-model="sortBy" class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm">
                            <option value="price">价格 ↓</option>
                            <option value="ratings_count">评价数 ↓</option>
                            <option value="ratings">评分 ↓</option>
                            <option value="monthly_sales">月销 ↓</option>
                        </select>
                        <span class="text-xs text-gray-600" x-text="filteredProducts.length + ' 个产品'"></span>
                        <span class="text-xs text-gray-600" x-show="activeKeyword" x-text="'| 筛选词: ' + activeKeyword"></span>
                    </div>

                    <!-- 卡片网格 -->
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
                        <template x-for="p in filteredProducts" :key="p.asin">
                            <div class="bg-gray-800 rounded-lg border overflow-hidden transition-all hover:border-gray-500"
                                 :class="p.is_core ? 'border-blue-600 shadow-blue-900/20 shadow-md' : 'border-gray-700'">
                                <!-- 图片 -->
                                <div class="aspect-square bg-gray-700 flex items-center justify-center overflow-hidden">
                                    <img x-show="p.image" :src="p.image" class="w-full h-full object-contain"
                                         @error="\$el.style.display='none'">
                                    <span x-show="!p.image" class="text-gray-600 text-xs">无图</span>
                                </div>
                                <!-- 信息 -->
                                <div class="p-2.5 space-y-1">
                                    <div class="flex items-center gap-1">
                                        <span x-show="p.is_core" class="text-xs bg-blue-900 text-blue-300 rounded px-1">核心</span>
                                        <span x-show="p.hit_keywords.length > 0 && activeKeyword" class="text-xs bg-green-900 text-green-300 rounded px-1">命中</span>
                                        <span class="font-mono text-xs text-blue-400 truncate" x-text="p.asin"></span>
                                    </div>
                                    <div class="text-xs text-gray-400 truncate" x-text="p.brand || '--'"></div>
                                    <div class="flex items-center justify-between">
                                        <span class="font-mono text-sm font-bold text-white" x-text="'\$' + p.price.toFixed(2)"></span>
                                        <span class="text-xs text-yellow-400" x-text="p.ratings + '★'"></span>
                                    </div>
                                    <div class="flex items-center justify-between text-xs text-gray-500">
                                        <span x-text="(p.ratings_count || 0).toLocaleString() + ' 评'"></span>
                                        <span x-show="p.monthly_sales > 0" x-text="'月销' + p.monthly_sales"></span>
                                    </div>
                                    <div x-show="p.online_date" class="text-xs text-gray-600" x-text="p.online_date"></div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div x-show="filteredProducts.length === 0" class="text-center py-12 text-gray-500">
                        暂无匹配产品
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template x-if="error">
        <div class="bg-gray-800 rounded-xl p-6 border border-red-700 text-center">
            <p class="text-red-400" x-text="error"></p>
            <a :href="'/niche/{{ batch_id }}'" class="mt-3 inline-block text-blue-400 hover:text-blue-300 text-sm">← 返回 Niche 列表</a>
        </div>
    </template>
</div>

<script>
function nicheDetail() {
    return {
        niche: { name: '{{ niche_name }}', keywords: [] },
        summary: {},
        products: [],
        matrix: [],
        loading: true,
        error: '',
        activeKeyword: '',
        filterSource: 'all',
        sortBy: 'price',

        get filteredProducts() {
            let list = this.products;
            if (this.filterSource === 'core') list = list.filter(p => p.is_core);
            if (this.filterSource === 'similar') list = list.filter(p => !p.is_core);
            if (this.activeKeyword) {
                list = list.filter(p => p.hit_keywords && p.hit_keywords.includes(this.activeKeyword));
            }
            return list.sort((a, b) => (b[this.sortBy] || 0) - (a[this.sortBy] || 0));
        },

        async init() {
            try {
                const resp = await fetch('/api/niche/{{ batch_id }}/{{ niche_name }}');
                const data = await resp.json();
                if (data.error) { this.error = data.error; this.loading = false; return; }
                this.niche = data;
                this.summary = data.summary || {};
                this.products = data.products || [];
                this.matrix = data.matrix || [];
            } catch (e) {
                this.error = '加载失败: ' + e.message;
            }
            this.loading = false;
        }
    }
}
</script>
{% endblock %}
