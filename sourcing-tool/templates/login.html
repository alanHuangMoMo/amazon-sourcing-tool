<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选品工具 — 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white">亚马逊选品工具</h1>
            <p class="text-gray-500 text-sm mt-2">请输入访问密码</p>
        </div>

        <form id="loginForm" class="bg-gray-800 rounded-xl p-6 space-y-4 shadow-xl">
            <div>
                <input type="password" name="password" placeholder="密码"
                       class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white text-center text-lg focus:outline-none focus:border-blue-500"
                       autofocus />
            </div>
            <div id="errMsg" class="text-red-400 text-sm text-center hidden"></div>
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-medium text-white transition-colors">
                登录
            </button>
        </form>
    </div>

    <script>
    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('errMsg');
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || '/';

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = form.password.value;
        if (!pw) return;

        const r = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw }),
        });
        if (r.ok) {
            window.location.href = next;
        } else {
            errEl.textContent = '密码错误，请重试';
            errEl.classList.remove('hidden');
            form.password.value = '';
        }
    });
    </script>
</body>
</html>
