{% extends "base.html" %}
{% block content %}
<div x-data="abaImport()">
    <!-- 导入区域 -->
    <div class="bg-gray-800 rounded-lg p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">导入 ABA 月度报表</h2>
        <p class="text-gray-400 text-sm mb-4">
            上传亚马逊后台下载的 ABA 搜索词报表 CSV，系统自动识别站点和月份。
            同一站点同一月份的数据会<strong class="text-yellow-400">覆盖</strong>旧数据。
        </p>

        <div class="flex items-center gap-4">
            <label class="flex-1 relative cursor-pointer">
                <input type="file" accept=".csv" @change="onFileChange($event)" class="hidden">
                <div class="border-2 border-dashed border-gray-600 rounded-lg p-4 text-center hover:border-blue-500 transition"
                     :class="file ? 'border-green-500 bg-green-900/10' : ''">
                    <template x-if="!file">
                        <p class="text-gray-400">点击选择 CSV 文件</p>
                    </template>
                    <template x-if="file">
                        <p class="text-green-400" x-text="file.name"></p>
                    </template>
                </div>
            </label>
            <button @click="upload()" :disabled="!file || importing"
                    class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white px-6 py-2 rounded-lg font-medium transition">
                <template x-if="!importing">导入</template>
                <template x-if="importing">
                    <span class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        导入中...
                    </span>
                </template>
            </button>
        </div>

        <!-- 导入结果 -->
        <template x-if="result">
            <div class="mt-4 p-4 rounded-lg" :class="result.error ? 'bg-red-900/30 border border-red-700' : 'bg-green-900/30 border border-green-700'">
                <template x-if="result.error">
                    <p class="text-red-400" x-text="result.error"></p>
                </template>
                <template x-if="!result.error">
                    <div>
                        <p class="text-green-400 font-medium mb-2">导入成功</p>
                        <div class="grid grid-cols-4 gap-4 text-sm">
                            <div><span class="text-gray-400">站点</span><br><span class="text-white font-bold" x-text="result.domain"></span></div>
                            <div><span class="text-gray-400">月份</span><br><span class="text-white font-bold" x-text="result.report_date"></span></div>
                            <div><span class="text-gray-400">行数</span><br><span class="text-white font-bold" x-text="result.total_rows?.toLocaleString()"></span></div>
                            <div><span class="text-gray-400">耗时</span><br><span class="text-white font-bold" x-text="result.elapsed_sec + 's'"></span></div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- 已导入数据概览 -->
    <div class="bg-gray-800 rounded-lg p-6">
        <h2 class="text-xl font-bold mb-4">已导入数据</h2>
        <div x-ref="statsArea">
            <template x-if="stats">
                <div>
                    <p class="text-gray-400 mb-3">共 <span class="text-white font-bold" x-text="stats.total?.toLocaleString()"></span> 条记录</p>
                    <template x-if="Object.keys(stats.by_date || {}).length > 0">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-gray-400 border-b border-gray-700">
                                    <th class="text-left py-2 px-3">月份</th>
                                    <th class="text-left py-2 px-3">站点</th>
                                    <th class="text-right py-2 px-3">记录数</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="[date, count] in Object.entries(stats.by_date)" :key="date">
                                    <tr class="border-b border-gray-700/50 hover:bg-gray-700/30">
                                        <td class="py-2 px-3" x-text="date"></td>
                                        <td class="py-2 px-3">
                                            <template x-for="[d, c] in Object.entries(stats.by_domain || {})" :key="d">
                                                <span class="mr-2 px-2 py-0.5 bg-blue-900/50 rounded text-blue-300 text-xs" x-text="d"></span>
                                            </template>
                                        </td>
                                        <td class="py-2 px-3 text-right font-mono" x-text="count?.toLocaleString()"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template x-if="Object.keys(stats.by_date || {}).length === 0">
                        <p class="text-gray-500 text-center py-8">暂无数据</p>
                    </template>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function abaImport() {
    return {
        file: null,
        importing: false,
        result: null,
        stats: null,

        init() {
            this.loadStats();
        },

        onFileChange(e) {
            this.file = e.target.files[0];
            this.result = null;
        },

        async upload() {
            if (!this.file) return;
            this.importing = true;
            this.result = null;

            const formData = new FormData();
            formData.append('file', this.file);

            try {
                const resp = await fetch('/api/aba/import', { method: 'POST', body: formData });
                this.result = await resp.json();
                if (!this.result.error) {
                    this.loadStats();
                }
            } catch (e) {
                this.result = { error: '网络错误: ' + e.message };
            } finally {
                this.importing = false;
            }
        },

        async loadStats() {
            try {
                const resp = await fetch('/api/aba/stats');
                this.stats = await resp.json();
            } catch (e) {}
        }
    }
}
</script>
{% endblock %}
