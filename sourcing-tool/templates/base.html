<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亚马逊选品 SOP 自动化工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <style>
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center gap-4">
        <a href="/" class="text-lg font-bold text-blue-400 hover:text-blue-300">选品 SOP</a>
        <span class="text-gray-600">|</span>
        <a href="/" class="text-sm text-gray-400 hover:text-gray-200">上传</a>
        <a href="/aba" class="text-sm text-gray-400 hover:text-gray-200">ABA导入</a>
        <a href="/batches" class="text-sm text-gray-400 hover:text-gray-200">历史</a>
        <a href="/dashboard" class="text-sm text-gray-400 hover:text-gray-200">词根赛道</a>
    </nav>
    <main class="max-w-7xl mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
