services:
  - type: web
    name: amazon-sourcing-tool
    runtime: python
    plan: free
    buildCommand: cd sourcing-tool && pip install -r requirements.txt
    startCommand: cd sourcing-tool && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sourcing-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
        value: "changeme"
    autoDeploy: true

databases:
  - name: sourcing-db
    plan: free
